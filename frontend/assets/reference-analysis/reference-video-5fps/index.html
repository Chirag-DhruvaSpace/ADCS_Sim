<!doctype html><meta charset="utf-8"><title>Reference video · 5 fps frames</title>
<style>body{background:#080b10;color:#dce5f0;font:14px system-ui;margin:20px}img{max-width:100%;display:block;margin:auto}header{position:sticky;top:0;background:#080b10;padding:12px}input{width:65%}button,a{color:#dce5f0;background:#182535;border:0;padding:8px;border-radius:6px}#sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}#sheets img{width:100%}h1{font-size:20px}</style>
<header><h1>1,260 full-resolution frames · 3840 × 1664 · 5 fps</h1><button id="play">Play 5 fps</button> <input id="scrub" type="range" min="0" max="1259" value="0"> <span id="time">0.0 s</span></header>
<img id="frame" src="frames/00000.jpg"><p>Use the slider or arrow keys to inspect every sample. The Overview Earth pullback starts after 60 seconds.</p><h2>All timestamped contact sheets</h2><div id="sheets"></div>
<script>const slider=document.querySelector('#scrub'),frame=document.querySelector('#frame'),time=document.querySelector('#time');function show(i){slider.value=i;frame.src='frames/'+String(i).padStart(5,'0')+'.jpg';time.textContent=(i/5).toFixed(1)+' s';}slider.oninput=()=>show(+slider.value);let timer;document.querySelector('#play').onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='Play 5 fps';}else{timer=setInterval(()=>show((+slider.value+1)%1260),200);play.textContent='Pause';}};document.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(Math.max(0,Math.min(1259,+slider.value+(e.key==='ArrowRight'?1:-1))));}};for(let i=0;i<26;i++){const a=document.createElement('a');a.href='sheets/'+String(i).padStart(2,'0')+'.jpg';a.innerHTML='<img loading="lazy" src="'+a.href+'">'+(i*10)+'–'+Math.min(252,i*10+10)+' seconds';sheets.append(a);}</script>
