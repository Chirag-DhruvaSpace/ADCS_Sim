name: Notify Parent Repo

on:
  push:
    branches:
      - main
      - master

jobs:
  ping-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Send update dispatch to ADCS_SITL
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PARENT_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Vighnesh-acs/ADCS_SITL/dispatches \
            -d '{"event_type": "update_submodule", "client_payload": {"sha": "${{ github.sha }}"}}'
